spring.application.name=controle-horas

# Porta dinamica injetada pelo Render (padrao 10000)
server.port=${PORT:10000}

# Banco de Dados MySQL (Aiven)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/controle_horas_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:messi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Otimizacao do HikariCP: desativa o bloqueio da porta em caso de latencia de conexao no boot
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=0

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect