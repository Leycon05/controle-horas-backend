spring.application.name=controle-horas

# Porta do Servidor (no Render usará a porta dinâmica da nuvem, localmente usa 8080)
server.port=${PORT:8080}

# Conexão com o MySQL (Usa variáveis da nuvem se existirem, ou seu localhost por padrão)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/controle_horas_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:messi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect